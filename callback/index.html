<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Back to Kompas</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.4 system-ui, sans-serif; background: Canvas; color: CanvasText; padding: 16px; box-sizing: border-box; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 999px; background: #1f7a5c; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p>Returning to Kompas…</p>
  <a id="open" href="kompas://bank/callback">Open Kompas</a>
</main>
<script>
  // Enable Banking only accepts https redirects: this page hands the bank's ?code=…&state=… to the app unchanged.
  // Nothing is stored or sent anywhere; the code is useless without the app's own signed requests.
  var target = 'kompas://bank/callback' + location.search;
  document.getElementById('open').href = target;
  location.replace(target);
</script>
</body>
</html>
